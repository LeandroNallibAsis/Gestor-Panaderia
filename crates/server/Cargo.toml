[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Servidor API REST de Panadería Control con Axum, SQLx y PostGIS"

[dependencies]
panaderia-core = { path = "../core" }
argon2 = "0.5"
axum = "0.7"
chrono = { workspace = true }
dotenvy = "0.15"
jsonwebtoken = "9"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
