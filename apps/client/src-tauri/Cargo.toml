[package]
name = "panaderia-control-client"
version = "0.1.0"
description = "Cliente operativo para Panadería Control (Tauri 2 + SvelteKit)"
authors = ["Panadería Control"]
edition = "2021"

[lib]
name = "panaderia_control_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
